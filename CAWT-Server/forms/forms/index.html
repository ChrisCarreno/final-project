<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            background-color: #f4f6f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        form {
            background: linear-gradient(180deg, #dddddd 26%, #5c5c5c 70%);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 2px 4px 16px rgba(0, 0, 0, 0.1);
            max-width: 430px;
            width: 100%
        }

        fieldset {
            border: 4px solid #0e7ac2;
            border-radius: 8px;
            padding: 20px;
            margin-top: 2px;
            margin-bottom: 2px;
            background-color: #ffffff;
        }

        legend {
            font-weight: bold;
            color: #2c3e50;
            padding: 10px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #000000;
            font-weight: 520;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #362e2e;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea {
            resize: vertical;
        }

        .radio-label {
            display: inline-block;
            margin-right: 15px;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            margin-right: 4px;
        }

        .bottom-group {
            display: flex;
            gap: 9px;
            justify-content: flex-end;
        }

        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            background: linear-gradient(140deg, #f7f7f7 0%, #cecdcd 100%);
            color: #000000;
        }


        input[type="submit"] {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            background: linear-gradient(140deg, #e03d4b 0%, #eb0202 150%);
            color: #ffffff;
        }

        input[type="reset"]:hover {
            background-color: #c0392b;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        input[type="reset"]:active, input[type="submit"]:active {
            transform: scale(0.98);
        }
        
    </style>
</head>

<body>
    <form action="https://webdevbasics.net/scripts/demo.php" method="post">
        <fieldset>
            <div class="form-group">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Preferred Contact Method:</label>
                <div class="radio-group">
                    <lable class="radio-label">
                        <input type="radio" name="contact_method" value="Email"> Email
                    </lable>
                    <label class="radio-label">
                        <input type="radio" name="contact_method" value="Phone"> Phone
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="contact_method" value="Mail"> Mail
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            </div>

            <div class="buttom-group">
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </div>
        </fieldset>
    </form>
</body>
</html>
